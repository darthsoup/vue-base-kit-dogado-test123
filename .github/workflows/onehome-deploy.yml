# Generated by your hosting control panel. Settings changes arrive as a new pull request.
# onehome-workflow: template=1 settings=288f93e1467b
name: Deploy
on:
  push:
    branches: ['master']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onehome-deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install
        run: |
          pnpm install --frozen-lockfile
      - name: Build
        run: |
          pnpm run build
      - name: Check the output
        working-directory: .
        run: |
          if [ ! -f 'dist/index.html' ]; then
            echo "::error::No index.html in dist. Check the output folder in your hosting settings."
            exit 1
          fi
          size=$(du -sb 'dist' | cut -f1)
          if [ "$size" -gt 52428800 ]; then
            echo "::error::The build output is $size bytes, more than the limit of 52428800 bytes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onehome-site
          path: 'dist'
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
